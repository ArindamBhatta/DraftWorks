<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Main Shell Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="60%" stop-color="#FAB005" />
      <stop offset="100%" stop-color="#E67700" />
    </linearGradient>

    <!-- Center Ridge Highlight -->
    <linearGradient id="ridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F59F00" />
    </linearGradient>

    <!-- Brim Shadow -->
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59F00" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
  </defs>

  <!-- Helmet Dome / Main Shell -->
  <path d="M 35 125 
           C 35 65, 65 38, 100 38 
           C 135 38, 165 65, 165 125 
           Z" 
        fill="url(#helmetGrad)" />

  <!-- Center Top Ridge (Reinforcement) -->
  <path d="M 93 38 
           C 93 34, 107 34, 107 38 
           L 105 125 
           L 95 125 
           Z" 
        fill="url(#ridgeGrad)" />

  <!-- Side Reinforcement Ribs (Subtle contours) -->
  <path d="M 68 55 C 64 75, 62 100, 60 125" 
        fill="none" 
        stroke="#FFE066" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6" />

  <path d="M 132 55 C 136 75, 138 100, 140 125" 
        fill="none" 
        stroke="#E67700" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.5" />

  <!-- Front Peak / Extended Visor -->
  <path d="M 160 122 
           C 172 123, 182 128, 185 133 
           C 178 136, 162 135, 150 132 
           Z" 
        fill="#F59F00" />

  <!-- Main Lower Brim / Rim -->
  <path d="M 22 130 
           C 20 124, 30 123, 40 123 
           L 160 123 
           C 175 123, 185 127, 185 133 
           C 185 139, 168 143, 145 143 
           L 45 143 
           C 28 143, 20 137, 22 130 
           Z" 
        fill="url(#brimGrad)" />

  <!-- Brim Edge Highlight Line -->
  <path d="M 28 132 
           C 40 138, 150 138, 178 133" 
        fill="none" 
        stroke="#FFE066" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Under-Brim Shadow Base -->
  <ellipse cx="100" cy="141" rx="60" ry="4" fill="#C92A2A" opacity="0.35" />
</svg>
